server:
  port: 8080

spring:
  application:
    name: typ-english

  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: deepseek-v4-pro

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:lingua_learn}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASS:123456}

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASS:123456}

mybatis-plus:
  type-aliases-package: com.typenglish.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:typ-english-jwt-secret-key-2024}
  expiration: 604800000

logging:
  level:
    com.typenglish: debug
