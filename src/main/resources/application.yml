server:
  port: 8080

spring:
  application:
    name: typ-english

  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: deepseek-v4-flash

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:lingua_learn}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASS:123456}

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASS:123456}

mybatis-plus:
  type-aliases-package: com.typenglish.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:typ-english-jwt-secret-key-2024}
  expiration: 604800000

tts:
  azure:
    # 配置后使用官方 Azure Speech；未配置时自动使用免密 Edge Neural 兜底。
    key: ${AZURE_SPEECH_KEY:}
    region: ${AZURE_SPEECH_REGION:eastus}
  cache:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_TTS_BUCKET:lingua-learn-tts}

logging:
  level:
    com.typenglish: debug
